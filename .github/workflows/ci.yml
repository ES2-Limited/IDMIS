name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    name: Commit Hygiene & Identity Check
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check PR commits hygiene
        env:
          ALLOWED_AUTHOR_EMAILS: ${{ vars.ALLOWED_AUTHOR_EMAILS }}
        run: node scripts/check-pr-commits.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }}

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: idmis
          POSTGRES_PASSWORD: idmis
          POSTGRES_DB: idmis
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://idmis:idmis@localhost:5432/idmis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-web:
    name: Docker Web Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }} -- 'apps/web/**' 'packages/**' 'apps/web/Dockerfile' 'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' 'turbo.json')
            if [ -z "$CHANGED" ]; then
              echo "No relevant changes for docker-web."
              echo "run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "run=true" >> $GITHUB_OUTPUT

      - name: Build web container
        if: steps.filter.outputs.run == 'true'
        run: docker build -t idmis-web -f apps/web/Dockerfile .

      - name: Run container and verify SPA response
        if: steps.filter.outputs.run == 'true'
        run: |
          docker run -d --name test-web -p 8080:80 -e PORT=80 idmis-web
          sleep 2
          RESPONSE=$(curl -s http://127.0.0.1:8080/)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q 'id="root"'; then
            echo "Smoke test passed: SPA HTML returned."
          else
            echo "Smoke test failed: Expected SPA HTML."
            exit 1
          fi
          docker stop test-web && docker rm test-web
