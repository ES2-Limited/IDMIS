version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # until typescript-eslint supports TS 7
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
