services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: idmis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idmis
      POSTGRES_USER: idmis
      POSTGRES_PASSWORD: idmis
    ports:
      - '5432:5432'
    volumes:
      - idmis-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: idmis-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - idmis-redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: idmis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - idmis-miniodata:/data

  createbuckets:
    image: minio/mc:latest
    container_name: idmis-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/idmis;
      exit 0;
      "

volumes:
  idmis-pgdata:
  idmis-redisdata:
  idmis-miniodata:
