    <path d="M120 20 C180 80, 220 150, 220 210 C220 270, 175 310, 120 310 C65 310, 20 270, 20 210 C20 150, 60 80, 120 20 Z" fill="url(#accent-grad)" />
    <!-- Sprout / Canal white silhouette -->
